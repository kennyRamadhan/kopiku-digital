<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Warung kopi digital di Cikarang Selatan. Pre-order via web, ambil di toko, no antrian."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>KopiKu Digital — Kopi enak, tanpa antri.</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kopiku-theme');
          // Default to dark unless user has explicitly chosen light.
          var theme = stored === 'light' ? 'light' : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore storage errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
